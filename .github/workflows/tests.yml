name: Tests

on:
  push:
    branches:
      - main
      - feature/database-integrity
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

      - name: Verify migration lifecycle on a disposable database
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/twiva-integrity.sqlite
          DB_FOREIGN_KEYS: 'true'
          DB_URL: ''
        run: |
          touch "$DB_DATABASE"
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:rollback --force --no-interaction
          php artisan migrate --force --no-interaction

  mysql:
    runs-on: ubuntu-latest
    name: MySQL 8.4 / PHP 8.4
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: twiva_integrity_test
          MYSQL_ROOT_PASSWORD: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: twiva_integrity_test
      DB_USERNAME: root
      DB_PASSWORD: testing
      DB_URL: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Verify migration lifecycle on the disposable service database
        run: |
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:rollback --force --no-interaction
          php artisan migrate --force --no-interaction

      - name: Execute tests
        run: php artisan test
